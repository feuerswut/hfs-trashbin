name: Auto-merge stg into main

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.head.ref == 'stg'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (merge commit)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --merge --auto "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"

      - name: Wait for merge to complete
        id: wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            merged=$(gh pr view "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --json merged --jq .merged)
            if [ "$merged" = "true" ]; then
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "merged=false" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN-driven merges above do not emit events that trigger
      # sync-stg-with-main.yml (GitHub suppresses recursive workflow runs),
      # so stg is brought back in sync with main inline here instead.
      - uses: actions/checkout@v4
        if: steps.wait.outputs.merged == 'true'
        with:
          ref: stg
          fetch-depth: 0

      - name: Sync stg with main after merge
        if: steps.wait.outputs.merged == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge origin/main --no-edit
          git push origin HEAD:stg
